server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: backend-ufinet
  datasource:
    url: jdbc:h2:mem:ufinetdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  jpa:
    hibernate:
      # El esquema lo crea db/schema.sql; Hibernate no genera DDL.
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  webflux:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
